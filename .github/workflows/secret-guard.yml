name: Secret guard

# The hooks live on a developer's machine: they can be skipped with --no-verify,
# and a fresh clone has none until install-hooks.sh is run. This runs on the
# server, on every push and every pull request, and nobody can skip it.
#
# It reports; it cannot block a merge on its own. Branch protection would do
# that, and it needs a paid GitHub plan for a private repository.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The whole history: the range to inspect may predate a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Work out what this change introduces
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            echo "range=origin/${{ github.base_ref }}...HEAD" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # A branch created by this push: compare against the default branch.
            git fetch --quiet origin "${{ github.event.repository.default_branch }}"
            echo "range=origin/${{ github.event.repository.default_branch }}...HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse any secret
        run: python scripts/check_secrets.py --range "${{ steps.range.outputs.range }}"
