name: Docs

# The documentation site (https://umbaji.github.io/HLlama/): built on every
# pull request that touches it, so a broken page is seen before the merge;
# built and published to GitHub Pages on every push to main.
#
# Once, in the repository settings: Pages -> Build and deployment -> Source:
# "GitHub Actions". The repository must be public (or on a paid plan).
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - 'bot/README.md'
      - 'backend/README.md'
      - 'admin/README.md'
      - 'scripts/docs_sources.sh'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - 'bot/README.md'
      - 'backend/README.md'
      - 'admin/README.md'
      - 'scripts/docs_sources.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Copy the root and part files into the docs tree
        run: sh scripts/docs_sources.sh

      - name: Build the site
        # --strict: a broken link or a page left out of the nav fails the build.
        run: mkdocs build --strict

      - name: Keep the site for the deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
