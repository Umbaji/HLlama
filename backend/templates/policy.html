<!DOCTYPE html>
<html lang="$lang" dir="$dir">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="$meta_description">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0B5C4A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1512" media="(prefers-color-scheme: dark)">
<meta name="robots" content="index, follow">
<link rel="canonical" href="$canonical_url">
<link rel="alternate" hreflang="fr" href="$policy_path?lang=fr">
<link rel="alternate" hreflang="en" href="$policy_path?lang=en">
<title>$document_title</title>
<link rel="icon" href="$static_base/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="$static_base/consent.css">
<script src="$static_base/consent-theme.js"></script>
</head>
<body class="c-body" data-lang="$lang">

<header class="c-header">
  <div class="c-header__inner">
    <span class="c-brand">
      <img class="c-brand__mark" src="$static_base/mark.svg" alt="" width="34" height="34">
      <span class="c-brand__text">
        <span class="c-brand__name">$brand_name</span>
        <span class="c-brand__by">$brand_by</span>
      </span>
    </span>
    <div class="c-lang" role="group" aria-label="$lang_group_label" data-lang-active="$lang">
      <span class="c-lang__thumb" aria-hidden="true"></span>
      <a class="c-lang__item" href="?lang=fr" hreflang="fr" lang="fr"$fr_current>
        <span aria-hidden="true">FR</span>
        <span class="c-sr">$lang_name_fr</span>
      </a>
      <a class="c-lang__item" href="?lang=en" hreflang="en" lang="en"$en_current>
        <span aria-hidden="true">EN</span>
        <span class="c-sr">$lang_name_en</span>
      </a>
    </div>
  </div>
</header>

<main class="c-main" id="main">
  <section class="c-hero">
    <h1 class="c-hero__title">$page_title</h1>
    <p class="c-hero__intro">$page_intro</p>
    <p class="c-hero__meta">
      <span class="c-chip">$version_label $policy_version</span>
      <span class="c-hero__reading">$reading_time</span>
    </p>
  </section>

  <section class="c-card c-keypoints" aria-labelledby="h-keypoints">
    <h2 class="c-card__title" id="h-keypoints">$key_points_title</h2>
    <ul class="c-keypoints__list">$key_points_html</ul>
  </section>

  <article class="c-policy" id="policy">
$legal_content
  </article>
</main>

<footer class="c-footer">
  <div class="c-footer__text">
    <p class="c-footer__line">$footer_contact <a href="mailto:contact@umbaji.org">contact@umbaji.org</a></p>
    <p class="c-footer__line c-footer__muted">$footer_rights</p>
  </div>
  <p class="c-footer__copyright">$footer_copyright</p>
</footer>
</body>
</html>
