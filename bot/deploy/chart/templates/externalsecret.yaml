{{- if or .Values.secretEnv .Values.database.enabled }}
# Environment secrets read from your secret store. Names are given in full:
# the API and the bot share some of them (PSEUDO_ID_SECRET, BOT_API_KEY).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Chart.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Chart.Name }}-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{- range $name, $_ := .Values.secretEnv }}
        {{ $name }}: {{ printf "{{ .%s }}" $name | quote }}
        {{- end }}
        {{- with .Values.database }}
        {{- if .enabled }}
        # Built here so that the database password is never written
        # anywhere else.
        DATABASE_URL: {{ printf "%s://%s:{{ .dbPassword | urlquery }}@{{ .dbHost }}:5432/%s?sslmode=require" .scheme .user .name | quote }}
        {{- end }}
        {{- end }}
  data:
    {{- range $name, $key := .Values.secretEnv }}
    - secretKey: {{ $name }}
      remoteRef:
        key: {{ $key }}
    {{- end }}
    {{- with .Values.database }}
    {{- if .enabled }}
    - secretKey: dbHost
      remoteRef:
        key: {{ .hostSecret }}
    - secretKey: dbPassword
      remoteRef:
        key: {{ .passwordSecret }}
    {{- end }}
    {{- end }}
{{- end }}
